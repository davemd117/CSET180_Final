<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel= "stylesheet" href= "../static/styles/base.css">
</head>
<body>

    <div class="header">
        <form class="logout" action="/" method="POST">
            <label>{{session.username}}</label>
            <input type="submit" value="Logout">
        </form>
        <div class="primaryHeader">
            <h1>TechForge</h1>
            <div class="navbar">
                <ul>
                    <li><a href="{{ url_for('login_registration_blueprint.my_account')}}">My Account</a></li>
                    <li><a href="{{ url_for('products_blueprint.render_products')}}">Products</a></li>
                    <li><a href="{{ url_for('reviews_blueprint.reviews')}}">Reviews</a></li>
                    <li><a href="{{ url_for('carts_blueprint.cart')}}">Cart</a></li>
                    <li><a href="{{ url_for('orders_blueprint.orders')}}">My Orders</a></li>
                    <li><a href="{{ url_for('complaints_blueprint.complaints')}}">My Complaints</a></li>
                    <li><a href="{{ url_for('chats_blueprint.chat')}}">Chat</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="user_info">
        <h2>My Account</h2>
        <p>Email: {{user_info.email}}</p>
        <p>Username: {{user_info.username}}</p>
        <p>First name: {{user_info.first_name}}</p>
        <p>Last name: {{user_info.last_name}}</p>
    </div>

    <div class="footer">
        <p>© TechForge</p>
    </div>

</body>
</html>
